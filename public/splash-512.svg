<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background -->
  <rect width="512" height="512" fill="#0a0408"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,71,87,0.08)"/>
      <stop offset="50%" stop-color="rgba(255,165,2,0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Centered mascot (scaled down from icon.svg) -->
  <g transform="translate(256,180) scale(0.8)">
    <!-- Cloak body -->
    <ellipse cx="0" cy="120" rx="108" ry="125" fill="#c8b89a"/>
    <!-- Hood -->
    <ellipse cx="0" cy="15" rx="86" ry="94" fill="#d4c4a8"/>
    <!-- Hood shadow/face area -->
    <ellipse cx="0" cy="12" rx="56" ry="62" fill="#0d0608"/>

    <!-- X left eye -->
    <line x1="-36" y1="-2" x2="-18" y2="16" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="-18" y1="-2" x2="-36" y2="16" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
    <!-- O right eye -->
    <circle cx="22" cy="7" r="11" fill="none" stroke="#00d4ff" stroke-width="6"/>

    <!-- Cloak folds -->
    <path d="M-135 115 Q-161 200 -128 260 Q-78 288 -74 275 L-98 135 Z" fill="#b8a888"/>
    <path d="M135 115 Q161 200 128 260 Q78 288 74 275 L98 135 Z" fill="#b8a888"/>
    <path d="M-98 135 Q0 168 98 135 L106 275 Q0 298 -106 275 Z" fill="#c8b89a"/>

    <!-- Right arm with gamepad -->
    <path d="M69 145 Q139 118 172 162 Q189 192 156 212 Q122 225 92 202 Z" fill="#c8b89a"/>
    
    <!-- Flame glow -->
    <ellipse cx="136" cy="188" rx="38" ry="38" fill="rgba(0,180,255,0.15)"/>
    
    <!-- Gamepad -->
    <rect x="96" y="170" width="60" height="40" rx="12" fill="#1a8fd1"/>
    <rect x="99" y="173" width="54" height="34" rx="10" fill="#1e9fe8"/>
    
    <!-- D-pad and buttons -->
    <rect x="107" y="183" width="5" height="12" rx="2" fill="#0a5a8a"/>
    <rect x="104" y="186" width="11" height="5" rx="2" fill="#0a5a8a"/>
    <circle cx="140" cy="182" r="3.5" fill="#0a5a8a"/>
    <circle cx="147" cy="188" r="3.5" fill="#0a5a8a"/>
    <circle cx="140" cy="194" r="3.5" fill="#0a5a8a"/>
    <circle cx="133" cy="188" r="3.5" fill="#0a5a8a"/>

    <!-- Blue flames -->
    <path d="M112 168 Q107 150 119 138 Q122 155 131 160 Q119 158 112 168 Z" fill="#00aaff" opacity="0.9"/>
    <path d="M127 163 Q124 143 137 131 Q138 149 148 157 Q134 153 127 163 Z" fill="#00ccff" opacity="0.85"/>
    <path d="M143 166 Q143 149 155 139 Q155 155 164 163 Q150 159 143 166 Z" fill="#00aaff" opacity="0.8"/>
  </g>

  <!-- NOVA GAMES text -->
  <g transform="translate(256,350)">
    <!-- Main title -->
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4px" fill="#ffffff">
      NOVA GAMES
    </text>
    <!-- Subtitle -->
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2px" fill="#c8a5c5">
      FUTURISTIC GAME PORTAL
    </text>
    
    <!-- Accent line above -->
    <rect x="-40" y="-15" width="80" height="2" fill="#ff4757" rx="1"/>
    <!-- Accent line below -->
    <rect x="-50" y="45" width="100" height="2" fill="#ffa502" rx="1"/>
  </g>

  <!-- Loading dots animation area -->
  <g transform="translate(256,420)">
    <circle cx="-20" cy="0" r="4" fill="#ff4757" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#ff4757" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="20" cy="0" r="4" fill="#ff4757" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
</svg>